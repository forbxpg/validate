name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, contracts, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: validate
          POSTGRES_PASSWORD: validate
          POSTGRES_DB: test_validate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://validate:validate@localhost:5432/test_validate
      TEST_REDIS_URL: redis://localhost:6379/15
      MIGRATOR_APP_ROLE: validate_app
      MIGRATOR_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --all-packages --locked

      # pg_dump must not be older than the server, and the runner ships an older one.
      - name: PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run basedpyright

      - name: Import contracts
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest

      - name: Integration tests
        run: uv run pytest -m integration

      - name: Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://validate:validate@localhost:5432/test_validate
        run: |
          psql "postgresql://validate:validate@localhost:5432/test_validate" -c "CREATE ROLE validate_app NOLOGIN"
          uv run vld-migrate upgrade --no-backup
          uv run vld-migrate check
          uv run vld-migrate export-sql migration-sql
          uv run squawk --no-error-on-unmatched-pattern 'migration-sql/*.sql'
