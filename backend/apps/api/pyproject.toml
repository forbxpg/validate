[project]
name = "vld-api"
version = "0.0.0"
description = "HTTP API process: the FastAPI application and its composition root."
requires-python = ">=3.13"
dependencies = [
    "vld-core",
    "vld-web",
]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vld.api"

[tool.uv.sources]
vld-core = { workspace = true }
vld-web = { workspace = true }
