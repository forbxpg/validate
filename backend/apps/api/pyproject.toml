[project]
name = "vld-api"
version = "0.0.0"
description = "HTTP API process: the FastAPI application and its composition root."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1,<2.0.0",
    "fastapi>=0.141.1,<0.142.0",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",
    "typer>=0.27.2,<0.28.0",
    "uvicorn[standard]>=0.54.0,<0.55.0",
    "vld-auth",
    "vld-core",
    "vld-web",
]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
vld-api = "vld.api.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vld.api"

[tool.uv.sources]
vld-core = { workspace = true }
vld-web = { workspace = true }
vld-auth = { workspace = true }
