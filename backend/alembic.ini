# Migrations of every domain, one chain. !!!Run with vld-migrate, not alembic upgrade:!!!
# see apps/migrator/README.md.
[alembic]
script_location = %(here)s/apps/migrator/src/vld/migrator
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
path_separator = newline
# Every domain with tables adds its folder here, one per line.
version_locations =
    %(here)s/packages/core/src/vld/core/audit/migrations/versions
    %(here)s/packages/auth/src/vld/auth/migrations/versions
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s