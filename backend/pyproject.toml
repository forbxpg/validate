# Workspace root. It is not a package: members live in packages/ (domains and the
# shared kernel) and apps/ (the processes that run them). Install everything with
# `uv sync --all-packages`; plain `uv sync` installs the root only.
[project]
name = "validate-backend"
version = "0.0.0"
description = "validate backend: uv workspace root for the domain packages and the apps."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.1,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "import-linter>=2.15,<3.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.16.9,<0.17.0",
    "squawk-cli>=2.66.0,<3.0.0",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = ["packages/auth/tests/support"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-m",
    "not integration",
]
markers = ["integration: needs PostgreSQL and Redis from the local stand (make up)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "vld"
# Lets contracts name third-party packages (fastapi, starlette) as forbidden.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core stays free of the HTTP layer"
type = "forbidden"
source_modules = ["vld.core"]
forbidden_modules = ["vld.web", "fastapi", "starlette", "fastapi_pagination"]

[[tool.importlinter.contracts]]
name = "Packages never import apps"
type = "forbidden"
source_modules = ["vld.core", "vld.web", "vld.crossref"]
forbidden_modules = ["vld.api", "vld.migrator"]
