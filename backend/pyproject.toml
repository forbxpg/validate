# Workspace root. It is not a package: members live in packages/ (domains and the
# shared kernel) and apps/ (the processes that run them). Install everything with
# `uv sync --all-packages`; plain `uv sync` installs the root only.
[project]
name = "vld-backend"
version = "0.0.0"
description = "validate backend: uv workspace root for the domain packages and the apps."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.1,<2.0.0",
    "import-linter>=2.15,<3.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.16.9,<0.17.0",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
# importlib: test modules are named by their path, so two packages may both have
# tests/unit/test_models.py.
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-m",
    "not integration",
]
markers = ["integration: needs PostgreSQL and Redis from the local stand (make up)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "vld"

[[tool.importlinter.contracts]]
name = "Packages never import apps"
type = "forbidden"
source_modules = ["vld.core"]
forbidden_modules = ["vld.api"]
