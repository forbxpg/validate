# Workspace root. It is not a package: members live in packages/ (domains and the
# shared kernel) and apps/ (the processes that run them). Install everything with
# `uv sync --all-packages`; plain `uv sync` installs the root only.
[project]
name = "validate-backend"
version = "0.0.0"
description = "validate backend: uv workspace root for the domain packages and the apps."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.40.1,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "import-linter>=2.15,<3.0",
    "pre-commit>=4.6.2,<5.0.0",
    "pypdf>=6.19.0,<7.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.16.9,<0.17.0",
    "squawk-cli>=2.66.0,<3.0.0",
    "vld-crossref[cli]",
    "vld-vak[all]",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
vld-crossref = { workspace = true }
vld-vak = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
pythonpath = ["packages/auth/tests/support", "packages/crossref/tests/support"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "-m",
    "not integration and not crossref_live and not vak_full",
]
markers = [
    "integration: needs PostgreSQL and Redis from the local stand (make up)",
    "crossref_live: calls the real Crossref API; run by hand with CROSSREF_LIVE_MAILTO set",
    "vak_full: parses a whole VAK list; run by hand with VAK_PDF_PATH set",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_package = "vld"
# Lets contracts name third-party packages (fastapi, starlette) as forbidden.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "crossref is a standalone library: it imports no other vld package"
type = "forbidden"
source_modules = ["vld.crossref"]
forbidden_modules = ["vld.core", "vld.web", "vld.auth", "vld.api", "vld.migrator", "vld.worker"]

[[tool.importlinter.contracts]]
name = "The crossref core does not know its command line"
type = "forbidden"
source_modules = [
    "vld.crossref.errors",
    "vld.crossref.ids",
    "vld.crossref.journals",
    "vld.crossref.models",
    "vld.crossref.pagination",
    "vld.crossref.throttle",
    "vld.crossref.transport",
    "vld.crossref.works",
    "vld.crossref._client",
]
forbidden_modules = ["vld.crossref.cli", "typer", "rich", "dotenv"]

[[tool.importlinter.contracts]]
name = "vak is a standalone library: it imports no other vld package"
type = "forbidden"
source_modules = ["vld.vak"]
forbidden_modules = [
    "vld.core",
    "vld.web",
    "vld.auth",
    "vld.crossref",
    "vld.api",
    "vld.migrator",
    "vld.worker",
]

[[tool.importlinter.contracts]]
name = "The vak result knows neither the parser nor the downloader"
type = "forbidden"
source_modules = ["vld.vak.models", "vld.vak.errors"]
forbidden_modules = ["vld.vak.parser", "vld.vak.download", "pdfplumber", "pdfminer", "httpx"]

[[tool.importlinter.contracts]]
name = "Core stays free of the HTTP layer"
type = "forbidden"
source_modules = ["vld.core"]
forbidden_modules = ["vld.web", "fastapi", "starlette", "fastapi_pagination"]

[[tool.importlinter.contracts]]
name = "Packages never import apps"
type = "forbidden"
source_modules = ["vld.core", "vld.web", "vld.crossref", "vld.vak", "vld.auth"]
forbidden_modules = ["vld.api", "vld.migrator"]

[[tool.importlinter.contracts]]
name = "Core and web know no domain"
type = "forbidden"
source_modules = ["vld.core", "vld.web"]
forbidden_modules = ["vld.auth", "vld.crossref", "vld.vak"]

[[tool.importlinter.contracts]]
name = "auth.domain knows nothing outside itself"
type = "forbidden"
source_modules = ["vld.auth.domain"]
forbidden_modules = [
    "vld.auth.application",
    "vld.auth.infrastructure",
    "vld.auth.api",
    "vld.auth.di",
    "sqlalchemy",
    "fastapi",
    "pydantic",
]

[[tool.importlinter.contracts]]
name = "auth.application does not know infrastructure"
type = "forbidden"
source_modules = ["vld.auth.application"]
forbidden_modules = [
    "vld.auth.infrastructure",
    "vld.auth.api",
    "vld.auth.di",
    "sqlalchemy",
    "fastapi",
    "redis",
    "jwt",
    "bcrypt",
    "aiosmtplib",
]
# Direct imports only: the ports of core (`UnitOfWork`, `AuditLog`) live in packages
# that also hold their SQLAlchemy adapters.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "auth.api does not import infrastructure"
type = "forbidden"
source_modules = ["vld.auth.api"]
forbidden_modules = ["vld.auth.infrastructure"]
# The descriptor hands the providers to the root; routes never reach adapters.
allow_indirect_imports = true
