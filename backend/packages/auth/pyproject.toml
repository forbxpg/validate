[project]
name = "vld-auth"
version = "0.1.0"
description = "Accounts, email and password login, sessions, roles, the letters they need."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3,<6.0.0",
    "anyio>=4.15.1,<5.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "dishka>=1.10.1,<2.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "fastapi>=0.141.1,<0.142.0",
    "fastapi-pagination>=0.16.0,<0.17.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "redis>=8.1.0,<9.0.0",
    "sqlalchemy[asyncio]>=2.1.0,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
    "vld-core",
    "vld-web",
]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
vld-auth = "vld.auth.console:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vld.auth"

[tool.uv.sources]
vld-core = { workspace = true }
vld-web = { workspace = true }
