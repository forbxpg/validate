[project]
name = "vld-crossref"
version = "0.1.0"
description = "Asynchronous typed client of the Crossref REST API: works and journals."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.13.5,<3.0.0",
    "structlog>=26.1.0,<27.0.0",
    "tenacity>=9.1.4,<10.0.0",
]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
cli = [
    "python-dotenv>=1.2.3,<2.0.0",
    "typer>=0.27.2,<0.28.0",
]
all = ["vld-crossref[cli]"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vld.crossref"
