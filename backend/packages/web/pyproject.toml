[project]
name = "vld-web"
version = "0.1.0"
description = "General presentation layer: error handling, request-id middleware, throttling, mounting domains."
readme = "README.md"
authors = [
    { name = "forbxpg", email = "dwizard80@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.139.2",
    "fastapi-pagination[sqlalchemy]>=0.14.0",
    "structlog>=26.1.0",
    "greenlet>=3.0.0",
    "vld-core",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vld.web"

[tool.uv.sources]
vld-core = { workspace = true }