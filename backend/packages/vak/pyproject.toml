[project]
name = "vld-vak"
version = "0.1.0"
description = "The VAK list of peer-reviewed journals: a typed parser of its PDF and a downloader."
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.5,<3.0.0"]
# Internal to the workspace: PyPI refuses an upload with this classifier.
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
parser = ["pdfplumber>=0.11.10,<0.12.0"]
download = ["httpx>=0.28.1,<0.29.0"]
all = ["vld-vak[parser,download]"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vld.vak"
